<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<meta name="color-scheme" content="dark">
<meta name="description" content="指でぐるぐる回して、東京から大阪まで東海道を走り続けるドット絵ゲーム。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はしる、ずっと">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>はしる、ずっと</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: 16:9 pixel stage on top, big spin pad below; the whole screen is the touch surface.
   Single committed dark look (night-road arcade). */
:root {
  --bg: #12141c;
  --pad: #191c28;
  --line: #343a54;
  --fg: #ece9f4;
  --dim: #8a90ab;
  --accent: #ffb454;
  --good: #7be0a0;
  color-scheme: dark;
  --font: "DotGothic16", ui-monospace, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: flex; flex-direction: column; touch-action: none; }
#stageWrap { position: relative; flex: 0 0 auto; width: 100%; max-width: calc((100dvh - 190px) * 16 / 9); margin-inline: auto; }
#stage { display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; background: #000; }
#hud {
  position: absolute; inset: 0 0 auto 0; padding: 6px 8px; display: flex; justify-content: space-between; gap: 8px;
  font-size: clamp(11px, 3.1vw, 17px); line-height: 1.3; text-shadow: 0 1px 0 rgba(0,0,0,.65), 1px 0 0 rgba(0,0,0,.65), -1px 0 0 rgba(0,0,0,.65), 0 -1px 0 rgba(0,0,0,.65);
  pointer-events: none;
}
#hud .r { text-align: right; }
#hud b { color: var(--accent); font-weight: normal; }
#bar { position: relative; width: clamp(130px, 40vw, 220px); height: 7px; margin: 5px 0 3px auto; background: #0b0d14; border: 1px solid rgba(255,255,255,.55); box-shadow: 0 1px 0 rgba(0,0,0,.6); display: flex; }
#bar s { display: block; height: 100%; flex: 0 0 auto; }
#bar s:nth-child(odd) { background: #3d5688; }
#bar s:nth-child(even) { background: #6483c0; }
#bar u { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.28); }
#bar em { position: absolute; top: 2px; width: 2px; height: 3px; margin-left: -1px; background: #cfd6ea; }
#bar em.got { background: var(--good); top: 1px; height: 5px; }
#bar i { position: absolute; top: -4px; bottom: -4px; width: 4px; margin-left: -2px; background: var(--accent); box-shadow: 0 0 0 1px #12141c; }
#nextTxt { font-size: clamp(10px, 2.8vw, 13px); }
#seal {
  position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; text-align: center; font-size: 17px; line-height: 1.1; letter-spacing: .02em;
  color: #d9402f; background: rgba(255,250,240,.9); border: 3px solid #d9402f; box-shadow: 0 0 0 2px rgba(255,250,240,.9);
  opacity: 0; transform: rotate(-12deg) scale(1.6); pointer-events: none;
}
#seal.show { animation: stamp 1.6s ease-out forwards; }
@keyframes stamp { 0% { opacity: 0; transform: rotate(-12deg) scale(1.8); } 14% { opacity: 1; transform: rotate(-12deg) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: rotate(-12deg) scale(1); } }
@media (prefers-reduced-motion: reduce) { #seal.show { animation: none; opacity: 1; } }
#passTxt { font-size: clamp(10px, 2.8vw, 13px); color: #d6dbee; }
#book { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; touch-action: pan-y; }
#book[hidden] { display: none; }
#bookHead { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
#bookHead b { font-weight: normal; font-size: 17px; color: var(--accent); }
#bookHead button { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; }
#bookBody { overflow-y: auto; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); touch-action: pan-y; -webkit-overflow-scrolling: touch; }
#bookBody h3 { margin: 16px 0 8px; font-weight: normal; font-size: 13px; color: var(--dim); }
#bookBody .grid { display: flex; flex-wrap: wrap; gap: 6px; }
#bookBody .chip { padding: 5px 8px; font-size: 13px; border: 1px solid var(--line); color: var(--dim); min-width: 3.2em; text-align: center; }
#bookBody .chip.got { background: var(--good); border-color: var(--good); color: #10241a; }
#bookBody .chip.seen { color: var(--fg); border-style: dashed; }
#bookBody .chip small { display: block; font-size: 10px; opacity: .8; }
#toast {
  position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%) scale(.96);
  padding: 8px 14px; background: rgba(12, 14, 24, .82); border: 2px solid var(--accent); color: var(--fg);
  font-size: clamp(13px, 3.8vw, 20px); text-align: center; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
}
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#toast.got { border-color: var(--good); }
#card {
  position: absolute; left: 50%; top: 44px; transform: translate(-50%, -6px); min-width: 56%; max-width: 92%;
  padding: 6px 14px 7px; text-align: center; background: rgba(12,14,24,.78); border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
  opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none;
}
#card.show { opacity: 1; transform: translate(-50%, 0); }
#card b { display: block; font-weight: normal; font-size: clamp(18px, 6vw, 30px); letter-spacing: .12em; color: var(--accent); }
#card span { display: block; font-size: clamp(10px, 3vw, 14px); color: var(--fg); }
#tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
#tools button { font: inherit; font-size: 11px; color: var(--dim); background: transparent; border: 1px solid var(--line); padding: 5px 8px; cursor: pointer; }
#tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#padWrap { position: relative; flex: 1 1 auto; min-height: 150px; background: var(--pad); border-top: 2px solid var(--line); }
#pad { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hint {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  color: var(--dim); font-size: clamp(14px, 4.2vw, 20px); text-align: center; pointer-events: none; transition: opacity .4s;
}
#hint .ring { width: 54px; height: 54px; border: 3px dashed var(--dim); border-radius: 50%; animation: spin 2.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #hint .ring { animation: none; } }
#hint.hide { opacity: 0; }
#dbg {
  position: absolute; left: 10px; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: end; gap: 10px;
  font-size: 13px; color: var(--dim); pointer-events: none;
}
#gauge { flex: 1 1 auto; height: 8px; background: #0e1018; border: 1px solid var(--line); position: relative; max-width: 220px; }
#gauge i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
#gauge s { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 1px; background: var(--dim); }
#reset {
  pointer-events: auto; font: inherit; font-size: 12px; color: var(--dim); background: transparent; border: 1px solid var(--line);
  padding: 6px 10px; cursor: pointer;
}
#reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<style>
[hidden] { display: none !important; }
html { background: #12141c; }
#app { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
/* fever mode (after all stamps are collected) */
.rb { display: none; }
body.fever #hStamp, #fev {
  background: linear-gradient(90deg, #ff5d73, #ffd23f, #7be0a0, #4cc9f0, #c77dff, #ff5d73); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  text-shadow: none; filter: drop-shadow(0 1px 0 rgba(0,0,0,.85)); animation: rainbow 1.6s linear infinite;
}
#fev { display: block; font-size: clamp(11px, 3.4vw, 17px); }
#fev[hidden] { display: none !important; }
@keyframes rainbow { to { background-position: 200% 0; } }
body.fever #stageWrap { animation: glow 4s linear infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 16px 2px #ff5d73; } 20% { box-shadow: 0 0 16px 2px #ffd23f; } 40% { box-shadow: 0 0 16px 2px #7be0a0; } 60% { box-shadow: 0 0 16px 2px #4cc9f0; } 80% { box-shadow: 0 0 16px 2px #c77dff; } }
@media (prefers-reduced-motion: reduce) { body.fever #hStamp, #fev { animation: none; } body.fever #stageWrap { animation: none; box-shadow: 0 0 16px 2px #c77dff; } }
</style>
</head>
<body>


<div id="app">
  <div id="stageWrap">
    <canvas id="stage" width="256" height="144" aria-label="東京から大阪へ走る道"></canvas>
    <div id="hud">
      <div class="l"><span id="hKm">0</span> km<br><b id="hPref">東京都</b><br><small id="passTxt"></small></div>
      <div class="r"><span id="hSeason">春・往路(昼)</span><br>stamp <b id="hStamp">0/57</b> ・ <span id="hYear">1年目</span>
        <div id="bar" aria-hidden="true"><i id="mk"></i></div>
        <div id="nextTxt">次: 神奈川県まで 15km</div>
        <div id="fev" class="rb" hidden></div></div>
    </div>
    <div id="seal" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <div id="padWrap">
    <canvas id="pad"></canvas>
    <div id="card" aria-live="polite"></div>
    <div id="tools"><button id="tSound" type="button">音 ON</button><button id="tSeason" type="button">季節+1</button><button id="tNext" type="button">次の名所</button><button id="tSt" type="button">次の宿場</button><button id="tAll" type="button">全スタンプ</button><button id="tFev" type="button">フィーバー</button><button id="tBook" type="button">図鑑</button></div>
    <div id="hint"><div class="ring"></div><div>ここを指でぐるぐる回す<br><span style="font-size:.8em">小さい円でも大丈夫。離しても少し走り続けます<br>(パソコンはマウスで円を描く)</span></div></div>
    <div id="dbg">
      <div id="rpm">回転 0.0回/秒 ・ 速度 ×0.00</div>
      <div id="gauge"><i id="gfill"></i><s></s></div>
      <button id="reset" type="button">最初から</button>
    </div>
  </div>
</div>

<div id="book" hidden>
  <div id="bookHead"><b id="bookTitle">宿場スタンプ</b><button id="bookClose" type="button">閉じる</button></div>
  <div id="bookBody"></div>
</div>

<script>
(() => {
  "use strict";
  // ---------- constants ----------
  const W = 256, H = 144;
  const BASE_SPEED = 82;                 // px/s at x1.0
  const LEG_SECONDS = 210;               // one way at x1.0 (3.5 min) -> round trip 7 min
  const LEG = BASE_SPEED * LEG_SECONDS;  // px
  const KM_TOTAL = 550;
  const PX_PER_KM = LEG / KM_TOTAL;
  const STD_REV = 1.0;                   // rev/s that equals x1.0
  const ACCEL = 7, COAST = 1.5;          // speed-up rate / slow-down rate (small = long coast after the finger stops)
  const MAX_MULT = 2.0;
  const TURN_WINDOW = 0.35;              // s
  const SEASONS = ["春", "夏", "秋", "冬"];
  const PREFS = [[0, "東京都"], [15, "神奈川県"], [100, "静岡県"], [290, "愛知県"], [385, "三重県"], [465, "滋賀県"], [505, "京都府"], [522, "大阪府"]];
  // placeholder checkpoints: [km, name, color]. Season of each = index % 4.
  const SPOTS = [
    [3, "日本橋", "#c9503a", "nihonbashi", "すべての街道の起点・道路元標の橋"], [35, "横浜", "#4a8fd8", "yokohama", "開港の町・みなとみらいの景色"], [90, "箱根", "#7fb069", "hakone", "芦ノ湖と湯けむりの山道"], [130, "富士山", "#e8eef8", "fuji", "静岡と山梨にまたがる日本一高い山"],
    [260, "浜名湖", "#3f7fbf", "hamanako", "弁天島の赤い大鳥居"], [330, "名古屋城", "#d9b44a", "nagoya", "金のしゃちほこが輝くお城"], [462, "鈴鹿峠", "#8a8f9e", "suzuka", "霧の立ちこめる東海道の難所"], [480, "琵琶湖", "#4fb3c8", "biwa", "日本一大きな湖(滋賀県)"],
    [508, "三条大橋", "#a8503a", "sanjo", "東海道の終点・鴨川にかかる橋"], [524, "伏見", "#b8402f", "fushimi", "朱色の鳥居と酒蔵の町"], [546, "通天閣", "#d94a6a", "tsuten", "大阪・新世界のシンボルタワー"]
  ];
  // 57 post stations (Tokaido 53 + Kyokaido 4). [name, prefecture index, fixed season (-1 = balanced automatically)]
  const STATION_DEF = [
    ["品川",0,-1],
    ["川崎",1,-1],["神奈川",1,-1],["保土ヶ谷",1,-1],["戸塚",1,-1],["藤沢",1,-1],["平塚",1,-1],["大磯",1,-1],["小田原",1,-1],["箱根",1,2],
    ["三島",2,-1],["沼津",2,-1],["原",2,-1],["吉原",2,-1],["蒲原",2,3],["由比",2,0],["興津",2,-1],["江尻",2,-1],["府中",2,-1],["丸子",2,-1],["岡部",2,-1],["藤枝",2,-1],["島田",2,-1],["金谷",2,-1],["日坂",2,-1],["掛川",2,2],["袋井",2,-1],["見附",2,-1],["浜松",2,3],["舞阪",2,1],["新居",2,1],["白須賀",2,-1],
    ["二川",3,-1],["吉田",3,-1],["御油",3,-1],["赤坂",3,-1],["藤川",3,-1],["岡崎",3,-1],["池鯉鮒",3,1],["鳴海",3,-1],["宮",3,-1],
    ["桑名",4,-1],["四日市",4,-1],["石薬師",4,-1],["庄野",4,1],["亀山",4,3],["関",4,-1],["坂下",4,-1],
    ["土山",5,0],["水口",5,-1],["石部",5,-1],["草津",5,-1],["大津",5,-1],
    ["伏見",6,-1,516],["淀",6,-1,520],
    ["枚方",7,-1,526],["守口",7,-1,532]
  ];
  const STATIONS = (() => {
    const cnt = [0, 0, 0, 0], perPref = {};
    STATION_DEF.forEach(d => { perPref[d[1]] = (perPref[d[1]] || 0) + 1; if (d[2] >= 0) cnt[d[2]]++; });
    const seenPref = {};
    return STATION_DEF.map(d => {
      const j = seenPref[d[1]] = (seenPref[d[1]] || 0) + 1, start = PREFS[d[1]][0], end = d[1] + 1 < PREFS.length ? PREFS[d[1] + 1][0] : KM_TOTAL;
      let se = d[2]; if (se < 0) { se = cnt.indexOf(Math.min(...cnt)); cnt[se]++; }
      return { name: d[0], pref: d[1], km: d[3] || (start + (j - 0.5) / perPref[d[1]] * (end - start)), season: se };
    });
  })();
  const FXAX = {}; SPOTS.forEach(sp => { if (sp[3]) FXAX[sp[3]] = sp[0] * PX_PER_KM; });
  const CLEAR = [["biwa", 720], ["yokohama", 620], ["hamanako", 650], ["hakone", 520], ["sanjo", 360], ["nihonbashi", 560], ["nagoya", 200], ["fushimi", 300], ["suzuka", 400]];
  const SKY = [ // [day top, day bottom, night top, night bottom]
    ["#86d0f2", "#fde6ef", "#1c2150", "#4a3a78"],
    ["#3da5ff", "#c8efff", "#0d1b3d", "#2c4a7a"],
    ["#7fb0d6", "#f6d7a6", "#231a3a", "#6b3f4f"],
    ["#b4cbe0", "#eef4f8", "#0f1a2e", "#34476b"]
  ];
  const TREE = ["#f2a4c0", "#2f9e4f", "#e0782b", "#dfe9f0"];
  const GRASS = ["#8fcf7a", "#3f9a4a", "#b98a45", "#eef2f6"];
  const KEY = "hashiru-proto-v2";
  // all-stamps celebration and fever mode
  const CELEB_SEC = 7;                   // length of the "all 57 collected" celebration
  const FEVER_STEP_KM = 40;              // every 40 km run in fever = +1 fever level
  const FEVER_BASE = 1.5, FEVER_GROWTH = 1.12, FEVER_MAX = 6;   // speed factor = BASE * GROWTH^level, capped at MAX
  const feverFactor = lv => Math.min(FEVER_MAX, FEVER_BASE * Math.pow(FEVER_GROWTH, lv));
  const REDUCE = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();

  // ---------- state ----------
  const S = { rounds: 0, dir: 1, d: 0, stamps: [], seen: [], totalSec: 0, cleared: false, feverKm: 0 };
  let mult = 0, phase = 0, revRate = 0;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && typeof o.d === "number") Object.assign(S, o); }
  } catch (e) {}
  if (!Array.isArray(S.stamps)) S.stamps = [];
  if (!Array.isArray(S.seen)) S.seen = [];
  S.d = Math.max(0, Math.min(LEG, +S.d || 0));
  S.dir = S.dir === -1 ? -1 : 1;
  S.cleared = !!S.cleared; S.feverKm = Math.max(0, +S.feverKm || 0);
  let fxNow = 1, celebT = 0, fwT = 0, flashA = 0, feverLv = Math.floor(S.feverKm / FEVER_STEP_KM);   // fever speed factor now / celebration timer / fireworks timer / white flash / fever level
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const cv = $("stage"), ctx = cv.getContext("2d");
  const pad = $("pad"), pctx = pad.getContext("2d");
  function hash(n) { n = (n | 0) ^ 0x9e3779b9; n = Math.imul(n ^ (n >>> 16), 0x85ebca6b); n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
  const lerp = (a, b, t) => a + (b - a) * t;
  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function mix(a, b, t) { const A = hex(a), B = hex(b); return "rgb(" + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(",") + ")"; }
  const seasonIdx = () => S.rounds % 4;
  const isNight = () => S.dir < 0;
  const aRoute = () => (S.dir > 0 ? S.d : LEG - S.d);   // route coordinate (px from Tokyo)
  const RX = () => (S.dir > 0 ? 88 : 168);

  // ---------- spin detection (heading change of the finger path) ----------
  const turns = [];            // {t, a}
  let active = false, lastPt = null, lastVec = null, idleUntil = 0;
  const trail = [];
  function now() { return performance.now() / 1000; }
  function onDown(e) {
    active = true; lastPt = { x: e.clientX, y: e.clientY }; lastVec = null; turns.length = 0;
    try { e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch (_) {}
    $("hint").classList.add("hide"); ensureAudio();
    e.preventDefault();
  }
  function onMove(e) {
    if (!active) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    const list = evs && evs.length ? evs : [e];
    for (const p of list) step(p.clientX, p.clientY);
    e.preventDefault();
  }
  function step(x, y) {
    const dx = x - lastPt.x, dy = y - lastPt.y;
    if (dx * dx + dy * dy < 16) return;                       // ignore moves under 4px
    const t = now();
    if (lastVec) {
      const cross = lastVec.x * dy - lastVec.y * dx, dot = lastVec.x * dx + lastVec.y * dy;
      const ang = Math.atan2(cross, dot);
      if (Math.abs(ang) < 1.8) turns.push({ t, a: ang });     // a sharp U-turn is a back-and-forth swipe, not a circle
    }
    lastVec = { x: dx, y: dy }; lastPt = { x, y };
    const r = pad.getBoundingClientRect();
    trail.push({ x: x - r.left, y: y - r.top, t });
  }
  function onUp() { active = false; lastVec = null; }
  const app = $("app");
  app.addEventListener("pointerdown", onDown, { passive: false });
  window.addEventListener("pointermove", onMove, { passive: false });
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  app.addEventListener("contextmenu", e => e.preventDefault());

  function revPerSec() {
    const t = now();
    while (turns.length && t - turns[0].t > TURN_WINDOW) turns.shift();
    let s = 0; for (const k of turns) s += k.a;
    return Math.abs(s) / (2 * Math.PI) / TURN_WINDOW;
  }

    E.ambience = (water, wind) => {
      if (!waterG) return; const t = ctx.currentTime, w = 0.8 + 0.2 * Math.sin(t * 0.9);
      waterG.gain.setTargetAtTime(0.1 * water * w, t, 0.4); windG.gain.setTargetAtTime(0.12 * wind * (0.7 + 0.3 * Math.sin(t * 0.5)), t, 0.5);
    };
    E.setMuted = m => master.gain.setTargetAtTime(m ? 0 : 0.8, ctx.currentTime, 0.05);
    E.step = (vol, t) => { t = t || ctx.currentTime; burst(t, 0.045, 0.07 * clamp(vol, 0.3, 1.4), "bandpass", 1100, 0.9); };
    E.stamp = t => {
      t = t || ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
      g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.2);
      tone(988, t + 0.06, 0.55, "sine", 0.16); tone(1480, t + 0.06, 0.4, "sine", 0.08); tone(1976, t + 0.12, 0.3, "triangle", 0.05);
    };
    E.fanfare = (season, t) => {
      t = t || ctx.currentTime; const r = MUSIC[season].root + 12;
      [0, 4, 7, 12, 16].forEach((n, i) => tone(mf(r + n), t + i * 0.09, 0.4, "square", 0.05));
      [0, 4, 7, 12].forEach(n => tone(mf(r + n), t + 0.5, 0.9, "triangle", 0.08));
    };
    E.season = (season, t) => {
      t = t || ctx.currentTime; const M = MUSIC[season];
      [0, 2, 4].forEach((ix, i) => tone(mf(M.root + 12 + M.sc[ix % 5] + 12 * Math.floor(ix / 5)), t + i * 0.18, 0.7, "triangle", 0.09));
    };
    E.card = (kind, season, t) => {
      t = t || ctx.currentTime; const r = MUSIC[season].root + 12;
      (STINGER[kind] || STINGER.def).forEach((n, i) => tone(mf(r + n), t + i * 0.14, 0.55, "sine", 0.1));
    };
    E.complete = (season, t) => {                          // all stamps collected: rising run, then a big chord
      t = t || ctx.currentTime; const r = MUSIC[season].root + 12, run = [0, 4, 7, 12, 16, 19, 24, 28];
      run.forEach((n, i) => { tone(mf(r + n), t + i * 0.1, 0.5, "square", 0.045); tone(mf(r + n - 12), t + i * 0.1, 0.5, "triangle", 0.06); });
      [0, 4, 7, 12].forEach(n => tone(mf(r + 12 + n), t + 1, 1.6, "triangle", 0.09));
      [0, 7, 12, 16, 19].forEach(n => tone(mf(r + 12 + n), t + 1, 1.4, "sine", 0.06));
      burst(t + 1, 0.6, 0.12, "highpass", 5000, 0.7);
    };
    E.feverUp = (lv, t) => {                               // level-up blip
      t = t || ctx.currentTime; const b = 76 + (lv % 8);
      tone(mf(b), t, 0.14, "square", 0.05); tone(mf(b + 7), t + 0.07, 0.14, "square", 0.05); tone(mf(b + 12), t + 0.14, 0.3, "triangle", 0.08);
    };
    E.pop = t => { t = t || ctx.currentTime; burst(t, 0.14, 0.1, "bandpass", 1600, 0.8); tone(mf(92 + Math.floor(Math.random() * 10)), t, 0.25, "sine", 0.05); };
    return E;
  }
  let AUD = null, muted = false, lastStepIdx = 0;
  try { muted = localStorage.getItem("hashiru-mute") === "1"; } catch (e) {}
  function audioState() {
    const a = aRoute();
    const near = (k, R) => sstep(1 - Math.abs(FXAX[k] - a) / R);
    return {
      mult, season: seasonIdx(), night: isNight(), fever: S.cleared ? fxNow : 0,
      water: Math.max(near("yokohama", 650), near("biwa", 650), near("hamanako", 650), near("hakone", 500), near("sanjo", 450), near("nihonbashi", 300) * 0.5),
      wind: Math.max(near("suzuka", 650), near("fuji", 700), near("hakone", 500) * 0.6)
    };
  }
  function ensureAudio() {
    if (AUD || muted) { if (AUD && AUD.ctx.state === "suspended" && !muted) AUD.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ctx = new AC(); AUD = makeAudio(ctx, audioState, true); AUD.ctx = ctx; AUD.start(); if (ctx.state === "suspended") ctx.resume();
    } catch (e) { AUD = null; }
  }
  const snd = (name, ...args) => { if (AUD && !muted) try { AUD[name](...args); } catch (e) {} };

  // ---------- route bar: where you are between Tokyo and Osaka ----------
  const barEl = $("bar"), mk = $("mk"), spotDots = [];
  PREFS.forEach((p, i) => {
    const end = i + 1 < PREFS.length ? PREFS[i + 1][0] : KM_TOTAL, seg = document.createElement("s");
    seg.style.width = ((end - p[0]) / KM_TOTAL * 100) + "%"; barEl.insertBefore(seg, mk);
  });
  PREFS.slice(1).forEach(p => { const u = document.createElement("u"); u.style.left = (p[0] / KM_TOTAL * 100) + "%"; barEl.insertBefore(u, mk); });
  STATIONS.forEach(st => { const e = document.createElement("em"); e.style.left = (st.km / KM_TOTAL * 100) + "%"; barEl.insertBefore(e, mk); spotDots.push(e); });
  function nextText(km) {
    let idx = 0; PREFS.forEach((p, i) => { if (km >= p[0]) idx = i; });
    if (S.dir > 0) {
      if (idx + 1 < PREFS.length) return "次: " + PREFS[idx + 1][1] + "まで " + Math.max(1, Math.ceil(PREFS[idx + 1][0] - km)) + "km";
      return "大阪まで あと " + Math.max(0, Math.ceil(KM_TOTAL - km)) + "km";
    }
    if (idx > 0) return "次: " + PREFS[idx - 1][1] + "まで " + Math.max(1, Math.ceil(km - PREFS[idx][0])) + "km";
    return "東京まで あと " + Math.max(0, Math.ceil(km)) + "km";
  }

  // ---------- reset ----------
  let armed = 0;
  $("reset").addEventListener("pointerdown", e => e.stopPropagation());
  $("reset").addEventListener("click", () => {
    const b = $("reset");
    if (!armed) { armed = 1; b.textContent = "もう一度タップで消去"; setTimeout(() => { armed = 0; b.textContent = "最初から"; }, 3000); return; }
    armed = 0; b.textContent = "最初から";
    S.rounds = 0; S.dir = 1; S.d = 0; S.stamps = []; S.seen = []; S.totalSec = 0; S.cleared = false; S.feverKm = 0;
    mult = 0; fxNow = 1; celebT = 0; feverLv = 0; flashA = 0; fw.length = 0; save(); toast("最初からやり直し");
  });

  function soundLabel() { $("tSound").textContent = muted ? "音 OFF" : "音 ON"; }
  soundLabel();
  $("tSound").addEventListener("click", () => {
    muted = !muted; try { localStorage.setItem("hashiru-mute", muted ? "1" : "0"); } catch (e) {}
    if (muted) { if (AUD) { AUD.setMuted(true); AUD.ctx.suspend(); } } else if (AUD) { AUD.setMuted(false); AUD.ctx.resume(); } else ensureAudio();
    soundLabel();
  });
  if (location.hash !== "#debug") ["tSeason", "tNext", "tSt", "tAll", "tFev"].forEach(id => { $(id).hidden = true; });
  const allIdx = () => STATIONS.map((_, i) => i);
  $("tAll").addEventListener("click", () => { S.stamps = allIdx(); S.seen = allIdx(); S.cleared = false; celebT = 0; fxNow = 1; feverLv = 0; S.feverKm = 0; save(); });   // test: the next frame starts the celebration
  $("tFev").addEventListener("click", () => { S.stamps = allIdx(); S.seen = allIdx(); S.cleared = true; celebT = 0; S.feverKm = 0; feverLv = 0; fxNow = 1; save(); });   // test: straight into fever
  $("book").addEventListener("pointerdown", e => e.stopPropagation());
  function renderBook() {
    const body = $("bookBody"); body.textContent = "";
    $("bookTitle").textContent = "宿場スタンプ " + S.stamps.length + "/" + STATIONS.length + (S.cleared ? "  全制覇" : "");
    PREFS.forEach((p, pi) => {
      const list = STATIONS.map((st, i) => [st, i]).filter(x => x[0].pref === pi);
      const h = document.createElement("h3"); h.textContent = p[1] + "  " + list.filter(x => S.stamps.includes(x[1])).length + "/" + list.length; body.appendChild(h);
      const g = document.createElement("div"); g.className = "grid";
      list.forEach(([st, i]) => {
        const c = document.createElement("div"), got = S.stamps.includes(i), seen = S.seen.includes(i);
        c.className = "chip" + (got ? " got" : seen ? " seen" : "");
        c.textContent = seen || got ? st.name : "？？";
        if (seen || got) { const sm = document.createElement("small"); sm.textContent = SEASONS[st.season] + (got ? " 済" : ""); c.appendChild(sm); }
        g.appendChild(c);
      });
      body.appendChild(g);
    });
  }
  $("tBook").addEventListener("click", () => { renderBook(); $("book").hidden = false; });
  $("bookClose").addEventListener("click", () => { $("book").hidden = true; });
  $("tSt").addEventListener("click", () => {
    const a = aRoute(), R = STATIONS.map(st => st.km * PX_PER_KM);
    if (S.dir > 0) { const c = R.filter(v => v > a + 20); if (c.length) S.d = Math.max(0, Math.min(...c) - 420); }
    else { const c = R.filter(v => v < a - 20); if (c.length) S.d = Math.min(LEG, LEG - (Math.max(...c) + 420)); }
    save();
  });
  $("tools").addEventListener("pointerdown", e => e.stopPropagation());
  $("tSeason").addEventListener("click", () => { S.rounds++; toast(SEASONS[S.rounds % 4] + "になった(テスト)"); save(); });
  $("tNext").addEventListener("click", () => {
    const a = aRoute(), R = SPOTS.map(sp => sp[0] * PX_PER_KM);
    if (S.dir > 0) { const c = R.filter(v => v > a + 20); if (c.length) S.d = Math.max(0, Math.min(...c) - 650); }
    else { const c = R.filter(v => v < a - 20); if (c.length) S.d = Math.min(LEG, LEG - (Math.max(...c) + 650)); }
    cardFor = -1; save();
  });
  sizePad();
  if (location.hash === "#debug") window.__hashiru = { makeAudio, drawRunnerPx, STATIONS, S, get AUD() { return AUD; }, get mult() { return mult; }, get rev() { return revRate; }, get fx() { return fxNow; }, get celebT() { return celebT; }, get lv() { return feverLv; }, save };   // for local checks
  requestAnimationFrame(frame);
})();
</script>
